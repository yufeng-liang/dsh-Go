name: Build APK (intelligent-ui)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare runtime from official 1.0.15 APK
        run: |
          set -euo pipefail
          apk=/tmp/dsh-go-official.apk
          curl -fL --retry 3 --retry-delay 2             -o "$apk"             "https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.15/dsh-go-1.0.15-arm64.apk"
          out=runtime/out/arm64-v8a
          mkdir -p "$out/assets/runtime" "$out/jniLibs/arm64-v8a"
          unzip -j "$apk"             'assets/runtime/manifest.json'             'assets/runtime/rootfs-arm64-v8a.tar.xz'             -d "$out/assets/runtime"
          unzip -j "$apk"             'lib/arm64-v8a/libproot.so'             'lib/arm64-v8a/libproot-loader.so'             'lib/arm64-v8a/libtalloc.so'             'lib/arm64-v8a/libandroid-shmem.so'             -d "$out/jniLibs/arm64-v8a"
      - name: Install pinned NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - name: Build arm64 APK
        run: |
          chmod +x tooling/build-apk.sh
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ls "$ANDROID_NDK_HOME" | head
          tooling/build-apk.sh --release -f arm64 --build-name 1.0.15
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-intelligent-ui-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 3
